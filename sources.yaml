# Quellenregister — Was ist los bei uns?
# Ohne Eintrag hier läuft kein Collector. Diese Datei speist auch die UI-Seite „Quellen und Lizenzen“.
#
# Felder: id, name, betreiber, url, lizenz, lizenz_geprueft, lizenz_hinweis, namensnennung,
#         intervall (s), ratenlimit, auth, geo_bezug, datenschutz_risiko (niedrig|mittel|hoch),
#         aktiv, zuletzt_geprüft, collector (Modulname), params (Collector-spezifisch)
#
# lizenz_geprueft: false = Endpunkt live getestet, Lizenztext aber noch nicht an der Primärquelle
#                  bestätigt. Vor dem öffentlichen Start jede Zeile auf true bringen (Abschnitt 7 der Anweisung).

sources:
  - id: nina
    name: NINA Bevölkerungswarnungen
    kurzname: NINA / BBK
    betreiber: Bundesamt für Bevölkerungsschutz und Katastrophenhilfe (BBK)
    url: https://warnung.bund.de/api31
    lizenz: Nutzungsbedingungen NINA/BBK
    lizenz_geprueft: false
    lizenz_hinweis: >-
      Die API ist ohne Schlüssel erreichbar (live getestet). Ein maschinenlesbarer Lizenzvermerk
      steht in der OpenAPI-Beschreibung (bund.dev) nicht. Nutzungsbedingungen beim BBK bestätigen.
    namensnennung: "Quelle: Bundesamt für Bevölkerungsschutz und Katastrophenhilfe (BBK), NINA-Warnungen"
    intervall: 300
    ratenlimit: nicht veröffentlicht; wir fragen höchstens einmal je 5 Minuten und Region
    auth: keine
    geo_bezug: Dashboard je Kreis-ARS, danach Geometriefilter auf Südeifel + 120 km
    datenschutz_risiko: niedrig
    aktiv: true
    zuletzt_geprüft: "2026-09-29"
    collector: nina
    params:
      # 12-stelliger ARS. Kreise im 120-km-Radius (Rheinland-Pfalz, Saarland, ein Stück NRW); jeder Code ist live gegen die API geprüft (404 bei falschem Code).
      ars:
        - {ars: "072320000000", name: "Eifelkreis Bitburg-Prüm"}
        - {ars: "072350000000", name: "Trier-Saarburg"}
        - {ars: "072110000000", name: "Stadt Trier"}
        - {ars: "072330000000", name: "Vulkaneifelkreis"}
        - {ars: "072310000000", name: "Bernkastel-Wittlich"}
        - {ars: "100420000000", name: "Merzig-Wadern"}
        - {ars: "071350000000", name: "Cochem-Zell"}
        - {ars: "071340000000", name: "Birkenfeld"}
        - {ars: "071370000000", name: "Mayen-Koblenz"}
        - {ars: "071310000000", name: "Ahrweiler"}
        - {ars: "071400000000", name: "Rhein-Hunsrück-Kreis"}
        - {ars: "071110000000", name: "Stadt Koblenz"}
        - {ars: "071330000000", name: "Bad Kreuznach"}
        - {ars: "100410000000", name: "Regionalverband Saarbrücken"}
        - {ars: "100430000000", name: "Neunkirchen (Saar)"}
        - {ars: "100440000000", name: "Saarlouis"}
        - {ars: "100450000000", name: "Saarpfalz-Kreis"}
        - {ars: "100460000000", name: "St. Wendel"}
        - {ars: "053660000000", name: "Euskirchen"}
        - {ars: "053340000000", name: "Städteregion Aachen"}

  - id: dwd_warnungen
    name: DWD Wetterwarnungen (Landkreise)
    kurzname: DWD
    betreiber: Deutscher Wetterdienst (DWD)
    url: https://maps.dwd.de/geoserver/dwd/ows
    lizenz: GeoNutzV (DWD Open Data)
    lizenz_geprueft: false
    lizenz_hinweis: >-
      Endpunkt (WFS 2.0.0, Layer dwd:Warnungen_Landkreise) live getestet; die BBox-Achsenreihenfolge
      (lon,lat) wurde an einer Ebene mit festen Daten geprüft. Zum Testzeitpunkt lag bundesweit keine
      Warnung vor, deshalb folgen die Feldnamen der Dokumentation und nicht einer Live-Probe.
      Lizenztext und Feldliste bei der ersten echten Warnlage gegenprüfen.
    namensnennung: "Quelle: Deutscher Wetterdienst"
    intervall: 300
    ratenlimit: nicht veröffentlicht; ein Abruf je 5 Minuten
    auth: keine
    geo_bezug: WFS mit Bounding Box (lon,lat), danach Geometriefilter auf Südeifel + 120 km
    datenschutz_risiko: niedrig
    aktiv: true
    zuletzt_geprüft: "2026-09-29"
    collector: dwd_warnungen
    params:
      layer: "dwd:Warnungen_Landkreise"

  - id: brightsky
