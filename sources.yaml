  - id: autobahn
    name: Autobahn-API (Baustellen, Sperrungen, Verkehrsmeldungen, Stau)
    kurzname: Autobahn GmbH
    betreiber: Die Autobahn GmbH des Bundes
    url: https://verkehr.autobahn.de/o/autobahn
    lizenz: Nutzungsbedingungen Autobahn GmbH (zu bestätigen)
    lizenz_geprueft: false
    lizenz_hinweis: >-
      Endpunkt live getestet, ohne Schlüssel. Die OpenAPI-Beschreibung nennt Kontakt und
      Datenschutzseite, aber keine Datenlizenz. Beim Betreiber nachfragen. Stau, zähfließender
      Verkehr und Stillstand stammen aus dem Feld abnormalTrafficType der Verkehrsmeldungen; die
      Kennungen tragen den Vermerk INRIX, die Herkunft dieser Verkehrslage ist also ein Drittanbieter
      und gehört in die Lizenzanfrage. Abgedeckt sind nur Autobahnen, keine Bundes- und Landesstraßen.
    namensnennung: "Quelle: Die Autobahn GmbH des Bundes"
    intervall: 180
    ratenlimit: nicht veröffentlicht; 12 Abrufe je Lauf, nacheinander mit Pause, ein Lauf alle 3 Minuten (Stau ändert sich schnell)
    auth: keine
    geo_bezug: A1, A48, A60, A64 bundesweit geladen, Geometriefilter auf Südeifel + 120 km am Rand
    datenschutz_risiko: niedrig
    aktiv: true
    zuletzt_geprüft: "2026-09-29"
    collector: autobahn
    params:
      roads: [A1, A48, A60, A64]
      services: [roadworks, warning, closure]

  - id: adsblol
    name: Luftverkehr (ADS-B, adsb.lol)
    kurzname: adsb.lol
    betreiber: adsb.lol (Community-Netzwerk)
    url: https://api.adsb.lol
    lizenz: ODbL 1.0 (laut Betreiber-Dokumentation)
    lizenz_geprueft: false
    lizenz_hinweis: >-
      Die API-Seite nennt "License: ODbL 1.0" und "available to everyone". Ratenlimit und
      Regeln zur gewerblichen Nutzung stehen dort nicht. Vor öffentlichem Start beim Betreiber
      nachfragen. OpenSky wurde nicht gewählt: kommerzielle Nutzung, auch intern, braucht dort eine Lizenz.
    namensnennung: "Quelle: adsb.lol (ODbL 1.0)"
    intervall: 15
    ratenlimit: nicht veröffentlicht; ein Abruf alle 15 Sekunden (Live-Schleife), Mindestabstand 10 Sekunden. Bei Fehlern greift der Circuit Breaker.
    auth: keine
    geo_bezug: Abfrage 47 NM um Irrel, danach Feinfilter auf 120 km am Rand; nur Flugzeuge in der Luft
    datenschutz_risiko: mittel
    aktiv: true
    zuletzt_geprüft: "2026-09-29"
    collector: adsblol
    params:
      live: true   # holt die Live-Schleife (app/live.py), nicht der Fünf-Minuten-Zyklus

  - id: lbm_baustellen
    name: Baustellen und Sperrungen Rheinland-Pfalz (Mobilitätsatlas)
    kurzname: Mobilitätsatlas RLP
    betreiber: Ministerium für Wirtschaft, Verkehr, Landwirtschaft und Weinbau Rheinland-Pfalz (Mobilitätsatlas), Daten der Verkehrsbehörden RLP und der Straßenbauverwaltung Luxemburg
    url: https://maps.mobilitaetsatlas.de/geoserver/ows
    lizenz: nicht angegeben (zu klären)
    lizenz_geprueft: false
    lizenz_hinweis: >-
      WFS live getestet, ohne Schlüssel. Weder die Capabilities (keine Fees/AccessConstraints) noch die
      Erläuterung zum WMS/WFS-Dienst nennen eine Lizenz. Anfrage beim Mobilitätsatlas-Team stellen (Kontakt siehe README).
      Laut Betreiber unvollständig (nicht alle Kommunen liefern). Die im Dienst enthaltenen Meldungen der
      Autobahn GmbH werden verworfen, sie kommen über den Autobahn-Collector.
    namensnennung: "Quelle: Mobilitätsatlas Rheinland-Pfalz (MWVLW), Verkehrsbehörden RLP, Straßenbauverwaltung Luxemburg"
    intervall: 600
    ratenlimit: nicht veröffentlicht; 2 Abrufe je 10 Minuten (der Dienst aktualisiert alle 10 Minuten)
    auth: keine
    geo_bezug: WFS-Abfrage mit Bounding Box, Feinfilter auf 120 km am Rand; Verlauf als Linie, sonst Punkt
    datenschutz_risiko: niedrig
    aktiv: true
    zuletzt_geprüft: "2026-09-29"
    collector: lbm_baustellen

  - id: hochwasser_rlp
    name: Pegel Hochwasservorhersagezentrale Rheinland-Pfalz
    kurzname: Hochwasser RLP
    betreiber: Landesamt für Umwelt Rheinland-Pfalz (Hochwasservorhersagezentrale); Messwerte der Pegelbetreiber (SGD Nord, Kommunen, AGE Luxemburg, SPW Belgien)
    url: https://hochwasser.rlp.de/api/v1
    lizenz: nicht angegeben (zu klären)
    lizenz_geprueft: false
    lizenz_hinweis: >-
      Es ist die JSON-Schnittstelle, die die Webseite hochwasser.rlp.de selbst nutzt (/api/v1/config, /api/v1/index),
      nicht als offene API dokumentiert. Nutzungsbedingungen und Lizenz nicht gefunden. Die Urheberrechte liegen laut
      Länderübergreifendem Hochwasserportal bei der jeweiligen Hochwasserzentrale bzw. dem Pegelbetreiber. Vor jeder
      Weitergabe beim LfU RLP (Hochwassermanagement) anfragen. Für das Demo im Haus vertretbar, die Seite pollt dieselbe
      Datei alle 5 Minuten. Einzelne Messstellen kommen aus Luxemburg und Belgien (ostbelgische Our); WSV-Stellen werden
      verworfen (PEGELONLINE).
    namensnennung: "Quelle: Hochwasservorhersagezentrale Rheinland-Pfalz (LfU RLP), Pegelbetreiber laut Messstelle"
    intervall: 900
    ratenlimit: nicht veröffentlicht; ein Abruf (ca. 3 MB) alle 15 Minuten, Stammdaten 12 Stunden zwischengespeichert
    auth: keine
    geo_bezug: alle Messstellen im 120-km-Radius (UTM-32-Koordinaten der Stammdaten, Feinfilter am Rand)
    datenschutz_risiko: niedrig
    aktiv: true
    zuletzt_geprüft: "2026-09-29"
    collector: hochwasser_rlp

