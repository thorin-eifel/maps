    lizenz_hinweis: >-
      Endpunkt live getestet (16 Stationen im Radius: Mosel, Saar). Lizenz aus Kenntnis, nicht am
      Portal bestätigt. Prüm, Kyll, Sauer und Our sind keine WSV-Pegel und kommen in Phase 2
      (Hochwasserportal RLP, Luxemburg).
    namensnennung: "Quelle: Wasserstraßen- und Schifffahrtsverwaltung des Bundes (WSV), PEGELONLINE"
