    kurzname: NASA FIRMS
    betreiber: NASA LANCE / FIRMS (VIIRS auf Suomi NPP, NOAA-20, NOAA-21)
    url: https://firms.modaps.eosdis.nasa.gov/api/area/csv
    lizenz: NASA Earthdata-Datennutzungsrichtlinie (frei, auch kommerziell), Quellenangabe NASA FIRMS
    lizenz_geprueft: false
    lizenz_hinweis: >-
      Area-API laut Dokumentation: MAP_KEY im Pfad, 1 bis 5 Tage je Abruf, 5000 Transaktionen je 10 Minuten. Der Wortlaut der
      Datennutzungsrichtlinie ließ sich automatisiert nicht abrufen (HTTP 403); nach eigenem Kenntnisstand ist die Nutzung frei
      und ohne Namensnennungspflicht, das vor dem öffentlichen Start bestätigen. Ein Wärmepunkt ist kein bestätigter Brand
      (Feldbrand, Industrie, Biogas sehen gleich aus); Punkte niedriger Konfidenz werden verworfen.
