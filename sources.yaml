    name: Ortsdosisleistung (BfS-Messnetz)
    kurzname: BfS ODL
    betreiber: Bundesamt für Strahlenschutz (BfS)
    url: https://www.imis.bfs.de/ogc/opendata/ows
    lizenz: Datenlizenz Deutschland – Namensnennung – Version 2.0 (nach Kenntnisstand)
