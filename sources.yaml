    geo_bezug: Bounding-Box-Abfrage der letzten 2 Tage, Feinfilter auf 120 km am Rand
    datenschutz_risiko: niedrig
    aktiv: true
    zuletzt_geprüft: "2026-09-29"
    collector: nasa_firms

